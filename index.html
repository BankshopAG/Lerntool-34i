<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2747">
<title>Bankshop Akademie §34i</title>
<style>
:root{
  --bg:#f4f2ec;--card:#fff;--card2:#faf8f3;--ink:#0f1e33;--muted:#5f6b7d;--line:#e4dfd3;
  --navy:#0f2747;--navy2:#1c3d6b;--gold:#c5a253;--gold2:#a8862f;--goldsoft:#f6efdc;
  --g:#16a34a;--gbg:#e3f6ea;--y:#d4a106;--ybg:#fdf4d6;--r:#dc2626;--rbg:#fde8e8;--n:#9aa5b5;--nbg:#eef1f5;
  --shadow:0 1px 2px rgba(15,39,71,.06),0 8px 28px rgba(15,39,71,.08);--radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09111f;--card:#111c31;--card2:#15223b;--ink:#eef2f8;--muted:#9eaabd;--line:#22324f;
  --navy:#d9bd79;--navy2:#2b5088;--goldsoft:#2a2717;--g:#34d27a;--gbg:#0f2d1d;--y:#f2c94c;--ybg:#2f2810;--r:#f87171;--rbg:#351718;--n:#6b7a92;--nbg:#1a2740;--shadow:none}}
:root[data-theme="dark"]{--bg:#09111f;--card:#111c31;--card2:#15223b;--ink:#eef2f8;--muted:#9eaabd;--line:#22324f;
  --navy:#d9bd79;--navy2:#2b5088;--goldsoft:#2a2717;--g:#34d27a;--gbg:#0f2d1d;--y:#f2c94c;--ybg:#2f2810;--r:#f87171;--rbg:#351718;--n:#6b7a92;--nbg:#1a2740;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* Header */
header{background:#0f2747;color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid #c5a253}
:root[data-theme="dark"] header{background:#071022}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#071022}}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#e2c784,#a8862f);display:grid;place-items:center;flex:0 0 auto}
.wm{line-height:1.15;min-width:0}
.wm b{display:block;font-size:1rem;white-space:nowrap}.wm b span{color:#e2c784}
.wm small{font-size:.72rem;opacity:.75;white-space:nowrap}
.hstats{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.pill svg{flex:0 0 auto}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:#fff}
@media (max-width:420px){.wm b{font-size:.92rem}.wm small{font-size:.64rem}.pill.lv{display:none}.hbar{gap:8px}.logo{width:34px;height:34px}}
/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px rgba(15,39,71,.08)}
nav.tabs .wrap{display:flex;justify-content:space-around;padding:0 4px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy)}
nav.tabs button.on .ic{background:var(--goldsoft);border-radius:999px}
nav.tabs .ic{padding:2px 14px;display:grid;place-items:center;transition:background .2s}
main{padding:18px 0 30px}
section{display:none;animation:fade .25s ease}section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:1.45rem;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:16px 0 8px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy2);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#e2c784,#b8933a);color:#0f2747}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem;border-radius:14px}
.btn:disabled{opacity:.4;pointer-events:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.86rem;cursor:pointer;font-weight:600}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
/* hero */
.hero{background:linear-gradient(135deg,#0f2747,#1c3d6b);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(226,199,132,.35),transparent 70%)}
.hero .hrow{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.ring{position:relative;flex:0 0 auto}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .rv b{font-size:1.55rem}.ring .rv small{font-size:.68rem;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.1);border-radius:12px;padding:9px 10px}
.kpi b{display:block;font-size:1.15rem}.kpi span{font-size:.72rem;opacity:.8}
.xpbar{height:8px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#e2c784,#f7e2a8);border-radius:9px;transition:width .6s}
/* ampel */
.amp{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--nbg)}
.amp i{display:block;height:100%;transition:width .5s}
.amp .g{background:var(--g)}.amp .y{background:var(--y)}.amp .r{background:var(--r)}.amp .n{background:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}.dot.n{background:var(--n)}
.modrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.modrow:hover{background:var(--card2)}
.modrow:last-child{border-bottom:0}
.modnum{width:28px;height:28px;border-radius:8px;background:var(--goldsoft);color:var(--gold2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.modrow .t{font-weight:600;font-size:.92rem;margin-bottom:5px}
.modrow .p{font-weight:800;font-size:.9rem}
/* mode tiles */
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .2s;width:100%}
.mode:hover{border-color:var(--gold)}.mode:active{transform:scale(.985)}
.mode .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.mode b{display:block;font-size:1rem}.mode span{font-size:.84rem;color:var(--muted)}
.mi.navy{background:#e4ebf5;color:#1c3d6b}.mi.red{background:var(--rbg);color:var(--r)}.mi.gold{background:var(--goldsoft);color:var(--gold2)}.mi.green{background:var(--gbg);color:var(--g)}.mi.yel{background:var(--ybg);color:var(--y)}
:root[data-theme="dark"] .mi.navy{background:#1a2c4d;color:#9cc0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mi.navy{background:#1a2c4d;color:#9cc0f2}}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.segs{display:flex;gap:3px;flex:1}
.segs i{flex:1;height:7px;border-radius:5px;background:var(--nbg)}
.segs i.ok{background:var(--g)}.segs i.bad{background:var(--r)}.segs i.cur{background:var(--gold)}
.combo{font-weight:800;font-size:.85rem;color:var(--gold2);white-space:nowrap;display:flex;align-items:center;gap:4px}
.combo.hot{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.25)}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.st-g{background:var(--gbg);color:var(--g);border-color:transparent}.tag.st-y{background:var(--ybg);color:var(--y);border-color:transparent}.tag.st-r{background:var(--rbg);color:var(--r);border-color:transparent}.tag.multi{background:var(--goldsoft);color:var(--gold2);border-color:transparent}
.qtext{font-size:1.12rem;font-weight:700;line-height:1.4;margin:4px 0 14px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;font-size:.98rem;line-height:1.4}
.opt:active{transform:scale(.99)}
.opt .lt{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--card);border:2px solid var(--line);transition:all .15s}
.opt.multi .lt{border-radius:7px}
.opt.sel{border-color:var(--navy2);background:#eaf0f9}
:root[data-theme="dark"] .opt.sel{background:#1a2c4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt.sel{background:#1a2c4d}}
.opt.sel .lt{background:var(--navy2);border-color:var(--navy2);color:#fff}
.opt.c-ok{border-color:var(--g);background:var(--gbg)}.opt.c-ok .lt{background:var(--g);border-color:var(--g);color:#fff}
.opt.c-bad{border-color:var(--r);background:var(--rbg);animation:shake .35s}.opt.c-bad .lt{background:var(--r);border-color:var(--r);color:#fff}
.opt.c-miss{border-color:var(--y);background:var(--ybg)}.opt.c-miss .lt{border-color:var(--y);color:var(--y)}
.opt.c-dim{opacity:.5}
.opt .why{display:block;font-size:.75rem;font-weight:700;margin-top:3px}
.opt.c-ok .why{color:var(--g)}.opt.c-bad .why{color:var(--r)}.opt.c-miss .why{color:var(--y)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:13px 14px;margin-top:12px;font-size:.93rem;animation:fade .25s}
.fb.ok{background:var(--gbg);border:1px solid var(--g)}.fb.bad{background:var(--rbg);border:1px solid var(--r)}.fb.part{background:var(--ybg);border:1px solid var(--y)}
.fb b.h{display:block;font-size:1rem;margin-bottom:3px}
.qactions{display:flex;gap:8px;margin-top:14px}
.qactions .btn{flex:1}
.kbd{font-size:.72rem;color:var(--muted);text-align:center;margin-top:8px}
@media (hover:none){.kbd{display:none}}
/* result */
.res{text-align:center}
.bigring{margin:6px auto 8px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat3 div{background:var(--card2);border-radius:12px;padding:10px}
.stat3 b{display:block;font-size:1.2rem}
.stat3 span{font-size:.75rem;color:var(--muted)}
/* blitz */
.tbar{height:10px;border-radius:9px;background:var(--nbg);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r));transform-origin:left;transition:transform .1s linear}
.flash-ok{animation:fok .4s}.flash-bad{animation:fbad .4s}
@keyframes fok{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}100%{box-shadow:0 0 0 16px rgba(22,163,74,0)}}
@keyframes fbad{0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}100%{box-shadow:0 0 0 16px rgba(220,38,38,0)}}
/* exam */
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;position:sticky;top:64px;z-index:10;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}
.timer.warn{color:var(--r)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.qnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:.78rem;font-weight:700;cursor:pointer;position:relative}
.qnav button.done{background:#e4ebf5;border-color:var(--navy2)}
:root[data-theme="dark"] .qnav button.done{background:#1a2c4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qnav button.done{background:#1a2c4d}}
.qnav button.cur{outline:3px solid var(--gold);outline-offset:1px}
.qnav button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--y);border:2px solid var(--card)}
.qnav button.ok{background:var(--gbg);border-color:var(--g)}.qnav button.bad{background:var(--rbg);border-color:var(--r)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{text-align:center;padding:10px 6px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.badge .bi{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--nbg);color:var(--n)}
.badge.on .bi{background:linear-gradient(135deg,#f3dc9c,#b8933a);color:#0f2747;box-shadow:0 4px 14px rgba(197,162,83,.4)}
.badge b{display:block;font-size:.76rem;line-height:1.2}
.badge span{font-size:.66rem;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.badge:not(.on){opacity:.6}
/* flashcards */
.fcwrap{perspective:1200px;height:300px;margin:12px 0;touch-action:pan-y}
.fc{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc.out-l{transform:translateX(-120%) rotate(-12deg);opacity:0;transition:transform .3s,opacity .3s}
.fc.out-r{transform:translateX(120%) rotate(12deg);opacity:0;transition:transform .3s,opacity .3s}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);overflow:auto}
.fc .front{background:var(--card);font-size:1.2rem;font-weight:800}
.fc .back{background:linear-gradient(135deg,#0f2747,#1c3d6b);color:#fff;transform:rotateY(180deg);font-size:1.02rem}
.fc .hint{position:absolute;bottom:12px;font-size:.74rem;color:var(--muted);font-weight:500}
/* misc */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
details .in{padding:0 16px 16px}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
.tbl{overflow-x:auto}
.formula{background:var(--card2);border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;margin:6px 0}
input[type=text],input[type=number],input[type=date],select{font:inherit;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label.fld{display:block;font-size:.84rem;font-weight:600;color:var(--muted)}
label.fld input,label.fld select{margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:0}.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--g)}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
/* overlay */
.modal{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fade .2s}
.modal .box{background:var(--card);border-radius:22px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lvup{text-align:center}
.lvup .crest{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#f3dc9c,#b8933a);display:grid;place-items:center;color:#0f2747;font-weight:900;font-size:2rem;box-shadow:0 10px 30px rgba(197,162,83,.5);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#toasts{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#0f2747;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s,tout .4s 1.8s forwards;display:flex;gap:8px;align-items:center}
.toast.gold{background:linear-gradient(135deg,#e2c784,#b8933a);color:#0f2747}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.76rem;padding:10px 16px 20px}
footer b{color:var(--gold2)}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--navy2);min-height:3px}
.spark i.today{background:linear-gradient(180deg,#e2c784,#b8933a)}
.spark span{font-size:.66rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2747" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></div>
  <div class="wm"><b>CEB <span>Bankshop</span> AG</b><small>Vermittlung von Bankdienstleistungen</small></div>
  <div class="hstats">
    <span class="pill" id="hStreak" title="Lerntage in Folge"></span>
    <span class="pill lv" id="hLevel" title="Level"></span>

<li><b>Sondertilgung:</b> oft 5–10 % p. a. vereinbar</li>
<li><b>Nebenkosten:</b> GrESt 3,5–6,5 % (Sachsen 5,5 %), Notar/Grundbuch 1,5–2 %, Makler bis 3,57 %</li>
<li><b>Förderung:</b> KfW, Landesförderbanken (z. B. SAB), Wohn-Riester, Wohnungsbauprämie 10 % auf 700/1.400 €, Arbeitnehmersparzulage 9 % auf 470 €</li>
<li><b>Steuer:</b> Selbstnutzung keine Zinsabzüge; Vermietung: Zinsen, AfA (3 % ab 2023, sonst 2 %/2,5 %), Disagio; Spekulationsfrist 10 Jahre</li></ul>`,
6:`<ol><li>Begrüßung & Erstinformation</li><li>Anlass & Ziele (Kauf, Bau, Modernisierung, Anschluss; Selbstnutzung/Vermietung)</li><li>Persönliche Situation & Zukunft (Kinder, Elternzeit, Rente)</li><li>Finanzierungsbedarf: Kaufpreis + Nebenkosten + Modernisierung − Eigenkapital</li><li>Haushaltsrechnung: freier Betrag</li><li>Lösung: Darlehensart, Zinsbindung, Tilgung, Sondertilgung, Förderung</li><li>Risiken & Absicherung (RLV, BU, Gebäude)</li><li>Zusammenfassung, Unterlagen, nächste Schritte, Dokumentation</li></ol>
<ul><li>Eigenkapital mindestens Nebenkosten, ideal 20–30 %</li><li>Rate ≈ max. 35–40 % des Nettos, mit Puffer</li><li>Mieten nur 70–80 % ansetzen; Überstunden/Boni vorsichtig</li><li>Unterlagen: Ausweis, Gehaltsnachweise, Lohnsteuerbescheinigung bzw. BWA/Bilanzen/Steuerbescheide, Eigenkapitalnachweise, Exposé, Grundbuch, Flurkarte, Grundrisse, Wohnfläche; bei ETW Teilungserklärung, Protokolle, Wirtschaftsplan</li></ul>
<p><b>Häufige Fehler:</b> Erstinformation vergessen, sofort Produkt verkaufen, keine Haushaltsrechnung, Zinsänderungsrisiko nicht erwähnt, keine Zusammenfassung.</p>`,
7:`<p>Grundlagen aus dem BGB, die jeder Immobilienkauf berührt.</p>
<div class="tbl"><table><tr><th>Begriff</th><th>Kern</th></tr>
<tr><td>Rechtsfähigkeit</td><td>ab Geburt (§ 1 BGB)</td></tr>
<tr><td>Geschäftsfähigkeit</td><td>unter 7 unfähig · 7–17 beschränkt · ab 18 voll</td></tr>
<tr><td>Vertrag</td><td>Angebot + Annahme; Abstraktionsprinzip: Verpflichtung ≠ Verfügung</td></tr>
<tr><td>Anfechtung</td><td>Irrtum unverzüglich · Täuschung/Drohung 1 Jahr</td></tr>
<tr><td>Widerruf / Rücktritt</td><td>Widerruf = Verbraucherrecht ohne Grund · Rücktritt braucht Rücktrittsrecht</td></tr>
<tr><td>Vertragsarten</td><td>Darlehen (§ 488) · Werkvertrag = Erfolg · Dienstvertrag = Tätigkeit · Geschäftsbesorgung (§ 675)</td></tr></table></div>
<h3>Grundstück & Erwerb</h3>
<ul><li>Bauland · Rohbauland · Bauerwartungsland · land-/forstwirtschaftliche Fläche</li>
<li>Gebäude = wesentlicher Bestandteil (§ 94) · Zubehör (§ 97) geht im Zweifel mit</li>
<li>Wohnungs-/Teileigentum (WEG) · Erbbaurecht mit Erbbaugrundbuch</li>
<li>Erwerb durch Kauf, Erbschaft, Schenkung, Zuschlag (Eigentum mit Zuschlag, 10 % Sicherheitsleistung)</li>
<li>Direktkauf · Maklerkauf · Bauträgerkauf (MaBV, bis 7 Raten) · Bauherr (Werkverträge)</li>
<li>Beurkundung (§ 311b), Entwurf 2 Wochen vorher; Notar belehrt neutral</li>
<li>Ablauf: Kaufvertrag → Vormerkung → Negativattest Gemeinde → Fälligkeit → Zahlung → Unbedenklichkeitsbescheinigung → Umschreibung</li>
<li>Besitz, Nutzen, Lasten meist mit Kaufpreiszahlung; Gefahr mit Übergabe (§ 446)</li>
<li>Zugewinngemeinschaft als gesetzlicher Güterstand · Erbengemeinschaft verfügt gemeinsam</li></ul>
<h3>Grundbuch-Verfahren</h3><ul><li>Antrag + Bewilligung + Eintragung; Löschung mit Löschungsbewilligung</li><li>Abt. II: Vormerkung, Widerspruch, Verfügungsbeschränkung, Reallast, Dienstbarkeiten, Vorkaufsrecht</li><li>Nicht eingetragen: Baulasten, gesetzliches Vorkaufsrecht, öffentliche Lasten</li></ul>`,
8:`<div class="tbl"><table><tr><th>Bereich</th><th>Kernregeln</th></tr>
<tr><td>AGB-Recht</td><td>§ 305b Individualabrede vor AGB · § 305c überraschende Klausel gilt nicht · § 307 Inhaltskontrolle · BGH 2014: Bearbeitungsentgelt in AGB unwirksam</td></tr>
<tr><td>UWG</td><td>keine Irreführung (§ 5) · Telefon/E-Mail nur mit Einwilligung (§ 7) · Unterlassung, Schadensersatz, Gewinnabschöpfung</td></tr>
<tr><td>Firma & Titel</td><td>Firmenwahrheit (§ 18 HGB) · „Bank“ nur mit Erlaubnis (§ 39 KWG)</td></tr>
<tr><td>Rechts-/Steuerberatung</td><td>keine Einzelfallberatung durch Vermittler (RDG, StBerG)</td></tr>
<tr><td>Werbung</td><td>Sollzins, Nettodarlehensbetrag, Effektivzins, repräsentatives Beispiel (§ 17 PAngV)</td></tr>
<tr><td>Aufsicht</td><td>Banken: BaFin/Bundesbank (ggf. EZB) · Vermittler: Gewerbeaufsicht · Schlichtung kostenlos</td></tr>
<tr><td>Datenschutz</td><td>DSGVO: Zweckbindung, Datenminimierung, Auskunft/Löschung · Bußgeld bis 20 Mio. € / 4 %</td></tr>
<tr><td>Geldwäsche</td><td>Identifizieren, wirtschaftlich Berechtigter, PEP, Verdacht an FIU, kein Tipping-off, 5 Jahre aufbewahren</td></tr>
<tr><td>EU-Binnenmarkt</td><td>Dienstleistungs- und Niederlassungsfreiheit · Europäischer Pass</td></tr></table></div>
<p>Berufsverbände vertreten Interessen und bieten Weiterbildung; Gewerkschaften vertreten Arbeitnehmer. Die Erlaubnis erteilt nur die Behörde.</p>`,
9:`<h3>Wirtschaft</h3><ul><li>Preise aus Angebot und Nachfrage; Einfluss: Zinsen, Einkommen, Bevölkerung, Bau- und Bodenkosten</li>
<li>Steigende Zinsen dämpfen Nachfrage und Preise</li>
<li>EZB = Geldpolitik (Ziel 2 % Inflation) · Fiskalpolitik = Staat · Ordnungs-, Struktur-, Prozesspolitik</li>
<li>Konjunktur: Aufschwung → Boom → Abschwung → Rezession; im Abschwung strengere Kreditvergabe</li>
<li>Variable Zinsen folgen Leitzins/Euribor, lange Bauzinsen den Pfandbrief- und Bundesanleiherenditen</li></ul>
<h3>Rechnen mit Annuitäten</h3>
<div class="formula">Tilgungssatz = Monatsrate × 12 ÷ Darlehen − Sollzins</div>
<div class="formula">Kopplung: Zinsen Festdarlehen + Sparrate Tilgungsersatz</div>
<p>Je höher Zins bei gleicher Rate, desto länger die Laufzeit. Faustwerte bei 4 % Zins: 1 % Tilgung ≈ 40 Jahre, 2 % ≈ 28 Jahre, 3 % ≈ 21 Jahre.</p>
<h3>Steuern</h3>
<div class="tbl"><table><tr><th>Thema</th><th>Regel</th></tr>
<tr><td>Grunderwerbsteuer</td><td>3,5–6,5 % vom Kaufpreis (ohne angemessen bewertetes Inventar); Unbedenklichkeitsbescheinigung</td></tr>
<tr><td>Grundsteuer</td><td>Gemeinde, Hebesatz; seit 2025 neu bewertet (Bundesmodell oder Ländermodell)</td></tr>
<tr><td>Selbstnutzung</td><td>keine Zinsabzüge; § 35a Handwerker 20 % (max. 1.200 €); § 35c energetisch 20 % (max. 40.000 €)</td></tr>
<tr><td>Vermietung</td><td>Zinsen, Grundschuldkosten, Disagio, Erhaltung sofort; Gebäude + Nebenkosten über AfA; Boden nie</td></tr>
<tr><td>Anschaffungsnah</td><td>> 15 % der Gebäudekosten in 3 Jahren → AfA</td></tr>
<tr><td>Angehörige</td><td>ab 66 % ortsüblicher Miete voll entgeltlich; 50–66 % Prognose; unter 50 % Aufteilung</td></tr>
<tr><td>Verkauf</td><td>steuerfrei nach 10 Jahren oder bei Selbstnutzung (Verkaufsjahr + 2 Vorjahre)</td></tr>
<tr><td>Einkommensteuer</td><td>Einkünfte − Sonderausgaben − agB − Freibeträge = zvE · 14 % bis 42/45 % · Grundfreibetrag · Splitting</td></tr></table></div>`,
10:`<h3>Risiken der Finanzierung</h3>
<ul><li>Zinsänderung nach Zinsbindung → höhere Rate oder längere Laufzeit</li>
<li>Tilgungsersatz (Fonds, LV) kann Lücke lassen · Wechselkurs bei Fremdwährung</li>
<li>Persönlich: Arbeitslosigkeit, Krankheit, BU, Tod, Scheidung, Ortswechsel</li>
<li>Objekt: Sanierung, Gebäudeschäden; Elementarschäden nur mit Zusatzbaustein</li>
<li>Bauphase: Bauherrenhaftpflicht, Bauleistungs-, Feuerrohbauversicherung</li></ul>
<h3>Notleidende Kredite</h3>
<ul><li>Frühwarnzeichen: Rückstände, Überziehungen, Kontaktabbruch</li>
<li>Lösungen: Stundung, Tilgungsaussetzung, Laufzeitstreckung, freihändiger Verkauf</li>
<li>Verwertung: Zwangsversteigerung, Zwangsverwaltung, Zwangsräumung, Abtretungen, Bürgen</li></ul>
<h3>Beendigung</h3>
<div class="tbl"><table><tr><th>Wer</th><th>Wann</th></tr>
<tr><td>Kunde</td><td>Ende Zinsbindung · nach 10 Jahren (6 Mon.) · variabel (3 Mon.) · berechtigtes Interesse gegen VFE · § 505d</td></tr>
<tr><td>Bank</td><td>Verzug (§ 498) · Vermögensverschlechterung (§ 490 I) · wichtiger Grund (AGB)</td></tr></table></div>
<ul><li>VFE: Info-Pflicht bei Rückzahlungswunsch (§ 493 V) · Nichtabnahmeentschädigung bei Nichtabnahme</li>
<li>Prolongation: bequem, oft nicht der beste Zins · Umschuldung: günstiger, Grundschuld per Abtretung</li>
<li>Gesamtschuldner haften voll – Entlassung nur mit Zustimmung der Bank</li></ul>`
};

function answerQ(id,ok){
  const s=S.q[id]||{b:0,r:0,w:0,t:0};const before=st(id);
  if(ok){s.b=s.b===0?2:Math.min(5,s.b+1);s.r++}else{s.b=1;s.w++}

}

function toast(t,cls=''){const box=$('toasts');while(box.children.length>=3)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.innerHTML=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2400)}
let AC=null;
function sfx(type){
  if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={ok:[[660,.07],[880,.1]],bad:[[220,.16]],lvl:[[523,.1],[659,.1],[784,.1],[1047,.22]],tick:[[1200,.03]]}[type]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='bad'?.05:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9})}catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function confetti(n=120){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#e2c784','#b8933a','#16a34a','#1c3d6b','#f2c94c','#ffffff'];
  const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

function ring(p,size=110,stroke=10,col='#e2c784',bg='rgba(255,255,255,.18)'){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}" style="transition:stroke-dashoffset .8s"/></svg>`}
function ampBar(c,tot){const w=k=>(c[k]/tot*100)+'%';return `<div class="amp"><i class="g" style="width:${w('g')}"></i><i class="y" style="width:${w('y')}"></i><i class="r" style="width:${w('r')}"></i></div>`}

function pickSmart(n=12){
  const by=k=>shuffle(allIds().filter(i=>st(i)===k));
  const oldFirst=a=>a.sort((x,y)=>(S.q[x]?.t||0)-(S.q[y]?.t||0));
  let r=by('r').slice(0,5),y=oldFirst(by('y')).slice(0,4),nw=by('n'),g=oldFirst(by('g')).filter(i=>Date.now()-(S.q[i].t||0)>2*864e5);
  let out=[...r,...y];out.push(...nw.slice(0,n-out.length));if(out.length<n)out.push(...g.slice(0,n-out.length));
  if(out.length<n)out.push(...shuffle(allIds().filter(i=>!out.includes(i))).slice(0,n-out.length));
  return shuffle(out);
}
function startSmart(){startSession(pickSmart(),'Smart-Training')}
function startRed(){const r=shuffle(allIds().filter(i=>st(i)==='r'));if(!r.length){toast('Keine roten Fragen – stark!','gold');return}startSession(r.slice(0,15),'Rote Fragen')}
function startModule(m){const ids=modIds(+m);const pri=[...shuffle(ids.filter(i=>st(i)==='r')),...shuffle(ids.filter(i=>st(i)==='n')),...shuffle(ids.filter(i=>st(i)==='y')),...shuffle(ids.filter(i=>st(i)==='g'))];startSession(shuffle(pri.slice(0,12)),'Modul '+m+' · '+MODS[m])}

  renderQ();window.scrollTo({top:0});
}
function renderQ(){
  if(qs.i>=qs.ids.length)return endSession();
  const id=qs.ids[qs.i],q=Q[id],multi=q.a.length>1,s=st(id);

function toggleOpt(oi,multi){

function markOpts(container,q,sel){

function checkQ(){
  if(qs.checked){qs.i++;qs.order=null;renderQ();window.scrollTo({top:0,behavior:'smooth'});return}
  if(!qs.sel.length)return;
  const id=qs.ids[qs.i],q=Q[id],sel=qs.sel.slice().sort(),a=q.a.slice().sort();
  const ok=a.length===sel.length&&a.every((v,k)=>v===sel[k]);
  const hits=sel.filter(x=>q.a.includes(x)).length;
  qs.checked=true;qs.res.push(ok);markOpts($('opts'),q,sel);
  const {before,after}=answerQ(id,ok);
  if(after==='g'&&before!=='g')qs.up++;if(before==='g'&&after!=='g')qs.down++;
  let xp=0;
  if(ok){qs.combo++;S.best.combo=Math.max(S.best.combo,qs.combo);xp=10+(q.a.length>1?5:0)+Math.min(qs.combo-1,10);sfx('ok');
    if(qs.combo%5===0){confetti(70);toast(IC.flame+' '+qs.combo+' richtige in Folge!','gold')}}
  else{qs.combo=0;xp=1;sfx('bad');buzz(60)}

  $('fb').innerHTML=`<div class="fb ${ok?'ok':part?'part':'bad'}"><b class="h">${ok?pick(['Richtig!','Stark!','Genau so!','Sitzt!']):part?'Fast – '+hits+' von '+q.a.length+' richtig':'Leider falsch'}</b>${!ok&&part?'In der Prüfung zählt nur vollständig richtig angekreuzt. ':''}${esc(q.e)}<div class="small" style="margin-top:6px;font-weight:700">Ampel: ${ST_LABEL[before]} → ${ST_LABEL[after]}</div></div>`;
  $('qBtn').textContent=qs.i+1<qs.ids.length?'Nächste Frage':'Auswertung';$('qBtn').disabled=false;
  const cb=$('combo');cb.innerHTML=qs.combo>1?IC.flame+'×'+qs.combo:'';cb.classList.remove('hot');void cb.offsetWidth;if(ok)cb.classList.add('hot');

}
function newCalc(){
  const k=cType==='mix'?pick(Object.keys(CALC)):cType;cur=CALC[k].g();cur.k=k;
  $('calcBox').innerHTML=`<div class="qcard"><div class="qmeta"><span class="tag">${CALC[k].n}</span>${cStreak>1?`<span class="tag st-g">${IC.flame} ${cStreak} in Folge</span>`:''}<span class="tag">${S.tot.calc} gelöst</span></div>
  <div class="qtext" style="font-weight:600">${cur.t}</div>
  <input type="text" inputmode="decimal" id="cIn" placeholder="Ergebnis in ${cur.u||'€'}" autocomplete="off">
  <div id="cFb"></div>
  <div class="qactions"><button class="btn ghost" onclick="calcSol()">Lösung zeigen</button><button class="btn" id="cBtn" onclick="calcCheck()">Prüfen</button></div></div>`;
  $('cIn').onkeydown=e=>{if(e.key==='Enter')$('cBtn').click()};
}
function calcCheck(){
  if(cur.done){newCalc();$('cIn').focus();return}
  const v=parseNum($('cIn').value);if(isNaN(v))return;const ok=calcOk(v,cur.a);cur.done=true;
  if(ok){cStreak++;S.tot.calc++;save();sfx('ok');addXP(15,true);if(cStreak%5===0){confetti(80);toast(IC.flame+' '+cStreak+' Rechnungen in Folge!','gold')}}else{cStreak=0;sfx('bad');buzz(60)}
  const k=dayKey();S.days[k]=(S.days[k]||0)+1;save();
  $('cFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="h">${ok?'Richtig gerechnet!':'Nicht ganz.'}</b>${cur.s}</div>`;
  $('cBtn').textContent='Nächste Aufgabe';$('cIn').disabled=true;checkBadges();header();
}
function calcSol(){cur.done=true;cStreak=0;$('cFb').innerHTML=`<div class="fb part">${cur.s}</div>`;$('cBtn').textContent='Nächste Aufgabe';$('cIn').disabled=true}

/* ===================== WISSEN ===================== */
let knowSub='stoff';
function renderKnow(){knowTab(knowSub)}
function knowTab(t){
  knowSub=t;
  $('v-know').innerHTML=`<h1>Wissen</h1><div class="subtabs" style="margin-top:10px">${[['stoff','Lernstoff'],['cards','Karteikarten'],['praxis','Praxisteil']].map(([k,n])=>`<button class="chip ${t===k?'on':''}" onclick="knowTab('${k}')">${n}</button>`).join('')}</div><div id="kb"></div>`;
  ({stoff:renderStoff,cards:renderCards,praxis:renderPraxis})[t]();
}
function renderStoff(){
  $('kb').innerHTML=Object.keys(MODS).map(m=>{const p=readiness(modIds(m));return `<details><summary><span class="modnum">${m}</span><span style="flex:1">${MODS[m]}</span><span class="small" style="color:${p>=70?'var(--g)':p>=40?'var(--y)':'var(--muted)'}">${p}%</span></summary><div class="in">${STOFF[m]}<button class="btn gold" style="margin-top:10px" onclick="startModule(${m})">Modul ${m} üben</button></div></details>`}).join('');
}
let fcL=[],fcI=0,fcMod='all';
function renderCards(){
  $('kb').innerHTML=`<select id="fcSel" onchange="fcMod=this.value;fcBuild()"><option value="all">Alle Module</option>${Object.keys(MODS).map(m=>`<option value="${m}" ${fcMod==m?'selected':''}>${m} · ${MODS[m]}</option>`).join('')}</select>
  <div class="fcwrap"><div class="fc" id="fc" onclick="this.classList.toggle('flip')"><div class="face front"><div id="fcF"></div><span class="hint">Tippen zum Umdrehen · wischen: links nochmal, rechts gewusst</span></div><div class="face back"><div id="fcB"></div></div></div></div>
  <div class="row" style="justify-content:space-between"><button class="btn ghost" style="flex:1;color:var(--r)" onclick="fcKnow(false)">✕ Nochmal</button><span class="muted small" id="fcPos" style="min-width:60px;text-align:center"></span><button class="btn" style="flex:1;background:var(--g)" onclick="fcKnow(true)">✓ Gewusst</button></div>`;
  let x0=null;const el=$('fc');
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  el.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70){fcKnow(dx>0)}});
  fcBuild();
}
function fcBuild(){fcL=FC.map((_,i)=>i).filter(i=>fcMod==='all'||FC[i][0]==fcMod);fcL=shuffle(fcL).sort((a,b)=>(S.fc[a]||0)-(S.fc[b]||0));fcI=0;fcShow()}
function fcShow(){const c=FC[fcL[fcI]],el=$('fc');if(!el)return;el.className='fc';$('fcF').innerHTML=`<span class="tag" style="margin-bottom:10px">Modul ${c[0]}</span>${esc(c[1])}`;$('fcB').textContent=c[2];$('fcPos').textContent=(fcI+1)+' / '+fcL.length}
function fcKnow(ok){const el=$('fc');if(!el)return;const id=fcL[fcI];S.fc[id]=(S.fc[id]||0)+(ok?1:-1);if(ok){S.tot.cards++;addXP(2)}save();
  if(!ok)fcL.splice(Math.min(fcI+4,fcL.length),0,id);sfx(ok?'ok':'tick');el.classList.add(ok?'out-r':'out-l');
  setTimeout(()=>{fcI=(fcI+1)%fcL.length;fcShow();checkBadges()},280)}
function renderPraxis(){
  $('kb').innerHTML=`<div class="card"><b>Checkliste für das Rollenspiel</b><p class="small muted" style="margin:4px 0 8px">Beim Üben abhaken – der Prüfer achtet auf Struktur und Kundenorientierung.</p>
  <div class="amp" style="margin-bottom:6px"><i class="g" style="width:${Object.values(S.chk).filter(Boolean).length/CHK.length*100}%"></i></div>
  ${CHK.map((c,i)=>`<label class="chk"><input type="checkbox" ${S.chk[i]?'checked':''} onchange="S.chk[${i}]=this.checked;save();renderPraxis()"><span>${c}</span></label>`).join('')}
  <button class="btn ghost" style="margin-top:8px" onclick="S.chk={};save();renderPraxis()">Häkchen zurücksetzen</button></div>
  <div class="card"><div class="row" style="justify-content:space-between"><b>Übungsfall</b><button class="btn ghost" onclick="newCase()">Neuer Fall</button></div><div id="caseBox"></div></div>
  <div class="card"><b>Mini-Finanzierungsrechner</b><div class="grid2" style="margin-top:10px">
  ${[['fKP','Kaufpreis €',320000,1000],['fGE','Grunderwerbst. %',5.5,.5],['fNO','Notar/Grundbuch %',2,.1],['fMA','Makler %',3.57,.01],['fEK','Eigenkapital €',50000,1000],['fZI','Sollzins %',3.7,.05],['fTI','Tilgung %',2,.1],['fEI','Netto inkl. Kindergeld €',5000,50],['fAU','Ausgaben €',2900,50]].map(([id,l,v,s])=>`<label class="fld">${l}<input type="number" id="${id}" value="${v}" step="${s}"></label>`).join('')}</div><div id="fOut" style="margin-top:12px"></div></div>`;
  ['fKP','fGE','fNO','fMA','fEK','fZI','fTI','fEI','fAU'].forEach(id=>$(id).addEventListener('input',calcF));newCase();
}
function newCase(){
  const n=pick(NAMES),[o,u,a,b]=pick(OBJ),P=rnd(a,b,5000),[bl,g]=pick(BL),ek=rnd(P*0.08,P*0.3,5000),ein=rnd(3200,7000,100),aus=Math.round(ein*rnd(0.45,0.6,0.01)/50)*50,tw=pick(TW);
  const nk=P*(g+2+3.57)/100,d=P+nk-ek,r=d*(3.7+2)/100/12,f=ein-aus;
  $('caseBox').innerHTML=`<p><b>${n}</b> möchte ein(e) <b>${o}</b> in ${bl} für <b>${eur(P,0)}</b> kaufen und ${u}. Eigenkapital <b>${eur(ek,0)}</b>, Haushaltsnetto inkl. Kindergeld <b>${eur(ein,0)}</b>, laufende Ausgaben ohne Miete <b>${eur(aus,0)}</b>. Makler 3,57 %. ${tw}</p>
  <p class="small muted">20 Minuten vorbereiten, dann 20 Minuten Beratungsgespräch führen.</p>
  <details style="box-shadow:none"><summary>Lösungsskizze</summary><div class="in"><ul><li>Nebenkosten: ${eur(nk,0)}</li><li>Darlehensbedarf: <b>${eur(d,0)}</b></li><li>Eigenkapitalquote: ${fmt(ek/(P+nk)*100,1)} % ${ek<nk?'– deckt nicht einmal die Nebenkosten: offen ansprechen!':''}</li><li>Rate bei 3,7 % + 2 %: ${eur(r,0)} · freier Betrag ${eur(f,0)} → ${r<f*0.85?'tragfähig mit Puffer':'zu knapp – Alternativen besprechen'}</li><li>Besonderheit gezielt aufgreifen: „${tw}“</li><li>Risiken, Absicherung, Unterlagen, nächste Schritte</li></ul></div></details>`;
  $('fKP').value=P;$('fGE').value=g;$('fEK').value=ek;$('fEI').value=ein;$('fAU').value=aus;calcF();
}
function calcF(){const v=id=>parseFloat($(id).value)||0;const P=v('fKP'),nk=P*(v('fGE')+v('fNO')+v('fMA'))/100,d=Math.max(0,P+nk-v('fEK')),r=d*(v('fZI')+v('fTI'))/100/12,f=v('fEI')-v('fAU');
  $('fOut').innerHTML=[['Kaufnebenkosten',nk],['Gesamtkosten',P+nk],['Darlehensbedarf',d],['Monatsrate',r],['Freier Betrag',f]].map(([l,x])=>`<div class="stat"><span>${l}</span><b>${eur(x,0)}</b></div>`).join('')+`<div class="stat"><span>Puffer nach Rate</span><b style="color:${f-r>=0?'var(--g)':'var(--r)'}">${eur(f-r,0)}</b></div>`}

/* ===================== EINSTELLUNGEN ===================== */
function openSettings(first){
  modal(`<h1>${first?'Willkommen in der Bankshop Akademie':'Einstellungen'}</h1>${first?'<p class="muted">Kurz einrichten – dann geht’s los. Alles bleibt nur auf diesem Gerät gespeichert.</p>':''}
  <div style="display:grid;gap:12px;margin:14px 0">
  <label class="fld">Dein Vorname<input type="text" id="sName" value="${esc(S.name)}" placeholder="z. B. Steffen"></label>
  <label class="fld">Prüfungstermin (optional)<input type="date" id="sExam" value="${S.exam}"></label>
  <label class="fld">Tagesziel<select id="sGoal">${[10,20,30,50].map(g=>`<option ${S.goal==g?'selected':''} value="${g}">${g} Fragen pro Tag</option>`).join('')}</select></label>
  <label class="chk" style="border:0"><input type="checkbox" id="sSound" ${S.sound?'checked':''}><span>Töne und Effekte</span></label>
  </div>
  <button class="btn gold big" onclick="saveSettings()">${first?'Los geht’s':'Speichern'}</button>
  ${first?'':`<h3>Lernstand</h3><div class="row"><button class="btn ghost" onclick="exportData()">Sichern (Datei)</button><label class="btn ghost" style="cursor:pointer">Laden<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label><button class="btn ghost" style="color:var(--r)" onclick="resetAll()">Zurücksetzen</button></div>
  <p class="small muted">Mit „Sichern“ nimmst du deinen Lernstand auf ein anderes Gerät mit.</p>
  <h3>Darstellung</h3><div class="row">${['auto','light','dark'].map(t=>`<button class="chip ${(document.documentElement.dataset.theme||'auto')===t?'on':''}" onclick="setTheme('${t}')">${{auto:'Automatisch',light:'Hell',dark:'Dunkel'}[t]}</button>`).join('')}</div>`}`);
}
function saveSettings(){S.name=$('sName').value.trim().slice(0,30);S.exam=$('sExam').value;S.goal=+$('sGoal').value;S.sound=$('sSound').checked;S.onboard=true;save();closeModal();if(curView==='start')renderStart()}
function setTheme(t){if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;try{localStorage.setItem(KEY+'_theme',t)}catch(e){}openSettings()}
try{const t=localStorage.getItem(KEY+'_theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lernstand-34i-'+dayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==2||typeof d.q!=='object')throw 0;S=Object.assign(S,d);save();closeModal();toast('Lernstand geladen','gold');go('start')}catch(e){alert('Die Datei ist kein gültiger Lernstand.')}};r.readAsText(f)}
function resetAll(){if(!confirm('Wirklich den gesamten Lernstand löschen? Das kann nicht rückgängig gemacht werden.'))return;const keep={name:S.name,exam:S.exam,goal:S.goal,sound:S.sound};S={v:2,xp:0,q:{},days:{},best:{combo:0,blitz:0},tot:{ans:0,ok:0,calc:0,cards:0,blitz:0},badges:{},sims:[],fc:{},chk:{},onboard:true,...keep};save();closeModal();go('start')}

/* ===================== START ===================== */
header();renderStart();
if(!S.onboard)setTimeout(()=>openSettings(true),400);
</script>
</body></html>
